name: CI/CD & Sovereign Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Consensus & Crypto Verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run Cryptographic & Consensus Tests
        run: |
          python -m pytest tests/test_core.py tests/test_exchange_rpc.py tests/test_bridge.py -v

  build-desktop:
    name: Build & Package Desktop Client (Windows)
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Desktop Dependencies
        working-directory: ./desktop
        run: |
          npm ci || npm install

      - name: Package Desktop Binary
        working-directory: ./desktop
        run: |
          npm run pack

      - name: Archive Windows Distribution
        shell: powershell
        run: |
          $distDir = "desktop/dist/win-unpacked"
          $zipName = "Doomsday-Windows-x64.zip"
          Compress-Archive -Path "$distDir/*" -DestinationPath "$zipName" -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zipName).Hash.ToLower()
          "$hash  $zipName" | Out-File -Encoding utf8 SHA256SUMS.txt
          Write-Host "Generated $zipName with SHA256: $hash"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doomsday-windows-x64
          path: |
            Doomsday-Windows-x64.zip
            SHA256SUMS.txt
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Doomsday-Windows-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
